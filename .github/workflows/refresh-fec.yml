name: Refresh official FEC candidate filings
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-fec.yml'
      - 'scripts/refresh_fec.py'
      - 'tests/test_refresh_fec.py'
      - 'scripts/archive_snapshot.py'
      - 'tests/test_archive_snapshot.py'
  schedule:
    - cron: '26 6,18 * * *'
concurrency:
  group: pollingbrain-fec-refresh
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh-fec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test FEC parser
        run: python -m unittest discover -s tests -v
      - name: Refresh FEC dataset
        run: python scripts/refresh_fec.py
      - name: Preserve verified source history and check timestamp
        run: python scripts/archive_snapshot.py
      - name: Commit changed dataset
        run: |
          git add public/data/fec_candidate_filings_2026.json public/data/history public/data/collection_status.json
          if git diff --cached --quiet; then
            echo 'No source changes'
            exit 0
          fi
          git config user.name 'pollingbrain-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'data: refresh sourced FEC filings'
          git push
