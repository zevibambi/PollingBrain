name: Import forty historical federal election cycles
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_40_elections.py'
      - '.github/workflows/import-40-elections.yml'
      - 'tests/test_40_elections.py'
  schedule:
    - cron: '35 7 * * 2'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/import_40_elections.py
      - name: Commit only changed verified data
        run: |
          git add public/data/house_40_election_cycles_1946_2024.json
          if git diff --cached --quiet; then
            echo "Dataset unchanged"
            exit 0
          fi
          git config user.name pollingbrain-data-bot
          git config user.email actions@users.noreply.github.com
          git commit -m 'data: import 40 sourced historical election cycles'
          git push
